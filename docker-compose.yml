name: network-control

# Everything is set in the setup wizard of the panel (open it in a browser after `./install.sh`): the storage, the
# sign-in, the VPS, the router and the gateway. .env only holds the passwords of the bundled PostgreSQL and ClickHouse
# (install.sh generates them) and, optionally, the version and the ports.

services:
  awg-client:
    build: ./awg-client
    image: onedev.evcsbrw.ru/monitoring/harbor/awg-client:${NC_VERSION:-2.0.4}
    container_name: nc-awg-client
    network_mode: host
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    # gateway.json and awg0.conf are written here by the panel.
    volumes: ["./awg-client/config:/config"]
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: nc-postgres
    environment:
      POSTGRES_DB: amnezia
      POSTGRES_USER: amnezia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (install.sh generates it)}
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amnezia -d amnezia"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  openbao:
    image: openbao/openbao:${OPENBAO_VERSION:-2.6.2}
    container_name: nc-openbao
    command: ["server", "-config=/openbao/config/config.hcl"]
    cap_add: [IPC_LOCK]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/keys:/openbao/keys:ro
      - ./data/openbao:/openbao/data
    restart: unless-stopped
    networks: [internal]

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: nc-clickhouse
    environment:
      CLICKHOUSE_DB: flows
      CLICKHOUSE_USER: amnezia
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (install.sh generates it)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: UTC
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/network-control.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/network-control.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped
    networks: [internal]

  # The backend and the flow collector run as uid 10001, the frontend as nginx (101). This one-shot service gives them
  # the folders they write to before they start, also on installations where those belonged to root.
  permissions:
    image: busybox:1.36
    container_name: nc-permissions
    command:
      - sh
      - -c
      - >-
        chown -R 10001:10001 /data/backend /data/shared /data/geoip /data/approle /gateway &&
        chown -R 101:101 /data/tiles &&
        chgrp 10001 /legacy.env && chmod 640 /legacy.env
    volumes:
      - ./data:/data
      - ./awg-client/config:/gateway
      - ./.env:/legacy.env
    network_mode: none
    restart: "no"

  flow-collector:
    build: ./flow-collector
    image: onedev.evcsbrw.ru/monitoring/harbor/flow-collector:${NC_VERSION:-2.0.4}
    container_name: nc-flow-collector
    ports: ["${FLOW_PORT:-2055}:2055/udp", "${SFLOW_PORT:-6343}:6343/udp"]
    volumes:
      - ./data/geoip:/data
      # collector.json (networks, addresses, ClickHouse) is written here by the panel.
      - ./data/shared:/shared:ro
    depends_on:
      permissions: { condition: service_completed_successfully }
      clickhouse: { condition: service_started }
    restart: unless-stopped
    networks: [internal, egress]

  backend:
    build: ./backend
    image: onedev.evcsbrw.ru/monitoring/harbor/backend:${NC_VERSION:-2.0.4}
    container_name: nc-backend
    volumes:
      # bootstrap.json, the AppRole of OpenBao, the setup code, known_hosts, backups, the GeoIP and OUI databases.
      - ./data/backend:/data
      - ./awg-client/config:/gateway
      - ./data/shared:/shared
      # Read once to take over an installation from before the setup wizard (its .env and the AppRole of bao-init).
      - ./.env:/legacy.env:ro
      - ./data/approle:/bao/approle:ro
    tmpfs: ["/run/panel:mode=0700,uid=10001,gid=10001"]
    depends_on:
      permissions: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      openbao: { condition: service_started }
      clickhouse: { condition: service_started }
    restart: unless-stopped
    networks: [internal, egress]

  frontend:
    build: ./frontend
    image: onedev.evcsbrw.ru/monitoring/harbor/frontend:${NC_VERSION:-2.0.4}
    container_name: nc-frontend
    ports: ["${PANEL_PORT:-8080}:8080"]
    volumes: ["./data/tiles:/var/cache/nginx/tiles"]
    depends_on: [backend]
    restart: unless-stopped
    networks: [internal, egress]

networks:
  internal:
    internal: true
  egress: {}
