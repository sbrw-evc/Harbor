proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=60d use_temp_path=off;
resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
        set $osm tile.openstreetmap.org;
        proxy_pass https://$osm/$1/$2/$3.png;
        proxy_ssl_server_name on;
        proxy_ssl_name tile.openstreetmap.org;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "NetworkControl/1.0 (self-hosted VPN admin panel; caching tile proxy)";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache tiles;
        proxy_cache_key $1/$2/$3;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 403 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        expires 7d;
        add_header X-Tile-Cache $upstream_cache_status always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
