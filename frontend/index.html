<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9edf2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Harbor</title>
    <script>
      // The theme before the first paint: the saved choice, else the system's (as in Umbrella Monitoring).
      (function () {
        var t = null;
        try { t = localStorage.getItem("network-control.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        try { var l = localStorage.getItem("lang"); if (l) document.documentElement.lang = l; } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
