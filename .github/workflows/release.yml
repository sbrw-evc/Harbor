name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/network-control

jobs:
  images:
    name: Image ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            platforms: linux/amd64,linux/arm64
            description: Harbor API, background jobs and SSE
          - component: frontend
            platforms: linux/amd64,linux/arm64
            description: Harbor web UI with API and map tile proxy
          - component: flow-collector
            platforms: linux/amd64,linux/arm64
            description: NetFlow / IPFIX / sFlow collector with enrichment for ClickHouse
          - component: awg-client
            platforms: linux/amd64
            description: AmneziaWG gateway client for selective LAN routing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=network-control-${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Prepare assets
        run: |
          set -eu
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DIR="dist/harbor-$VERSION"
          mkdir -p "$DIR"
          cp -r docker-compose.yml .env.example .gitattributes install.sh LICENSE README.md README.ru.md \
            awg-client backend frontend flow-collector openbao clickhouse mikrotik "$DIR/"
          # The images of this version (the image names keep network-control-* for existing installations).
          sed -i "s/^NC_VERSION=.*/NC_VERSION=$VERSION/" "$DIR/.env.example"
          tar -C dist -czf "dist/harbor-$VERSION-deploy.tar.gz" "harbor-$VERSION"
          ( cd dist && sha256sum "harbor-$VERSION-deploy.tar.gz" > SHA256SUMS )
          NOTES=".github/release-notes/$TAG.md"
          # shellcheck disable=SC2016 # the backticks are Markdown, not an expansion
          { [ -f "$NOTES" ] && cat "$NOTES" && echo; \
            printf '## Install\n\n```bash\ncurl -L https://github.com/%s/releases/download/%s/harbor-%s-deploy.tar.gz | tar xz\ncd harbor-%s && ./install.sh\n```\n\nThen open the address install.sh prints and go through the setup wizard.\n' \
              "$GITHUB_REPOSITORY" "$TAG" "$VERSION" "$VERSION"; } > dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Harbor ${{ inputs.tag || github.ref_name }}
          body_path: dist/notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/harbor-*-deploy.tar.gz
            dist/SHA256SUMS
