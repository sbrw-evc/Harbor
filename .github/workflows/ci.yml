name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nc
          POSTGRES_PASSWORD: nc
          POSTGRES_DB: nc
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nc" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Tests (ClickHouse SQL on chdb, PostgreSQL, drivers, SSH CLI)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://nc:nc@127.0.0.1:5432/nc
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: npm install --no-audit --no-fund && npm test && npm run build
