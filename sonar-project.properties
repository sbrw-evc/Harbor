# SonarQube analysis, run by the Release job of .onedev-buildspec.yml (and by the SonarQube job on demand).
sonar.host.url=http://192.168.0.104:9000
sonar.projectKey=monitoring-harbor
sonar.projectName=Monitoring/Harbor
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.exclusions=backend/demo/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/coverage/**,**/testdata/**,wiki/**,**/*.min.js,**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/tests/**,**/e2e/**,**/test_*.py
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/tests/**,**/e2e/**,**/test_*.py
sonar.test.exclusions=**/node_modules/**,**/testdata/**
# Coverage: the Release and SonarQube jobs run the tests first (backend: pytest-cov, frontend: vitest).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# The Russian dictionaries are data: their lines look alike by nature.
sonar.cpd.exclusions=frontend/src/i18n/**
